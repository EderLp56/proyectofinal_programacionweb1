<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda tu Visita | Museo Vórtice</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header class="encabezado">
    <div class="contenedor barra-flex">
      <a href="index.html" class="logo">MUSEO <span>VÓRTICE</span></a>
      <nav class="menu">
        <a href="index.html">Inicio</a>
        <a href="exposiciones.html">Exposiciones</a>
        <a href="galerias.html">Galerías</a>
        <a href="agenda.html" class="activo">Agenda tu visita</a>
        <a href="contacto.html">Contacto</a>
      </nav>
    </div>
  </header>

  <main class="seccion">
    <div class="contenedor" style="max-width: 640px;">
      <h1 class="titulo-seccion">Agenda tu Visita</h1>
      <p class="subtitulo-seccion">Completa tus datos para generar tu folio de visita.</p>

      <form id="form-agenda" class="formulario-contacto">
        <fieldset class="grupo-fieldset">
          <legend>Datos del Visitante</legend>

          <label for="nombre-visita">Nombre completo:</label>
          <input type="text" id="nombre-visita" name="nombre" placeholder="Escribe tu nombre" required>

          <label for="correo-visita">Correo electrónico:</label>
          <input type="email" id="correo-visita" name="correo" placeholder="Escribe tu correo electrónico" required>
        </fieldset>

        <fieldset class="grupo-fieldset">
          <legend>Detalles de la Visita</legend>

          <label for="fecha-visita">Fecha de visita:</label>
          <input type="date" id="fecha-visita" name="fecha" required>

          <label for="entrada-visita">Tipo de entrada:</label>
          <select id="entrada-visita" name="entrada">
            <option value="Entrada General ($90 MXN)">Entrada General ($90 MXN)</option>
            <option value="Estudiantes y Docentes ($45 MXN)">Estudiantes y Docentes ($45 MXN)</option>
            <option value="Niños y Adultos Mayores (Entrada libre)">Niños y Adultos Mayores (Entrada libre)</option>
          </select>

          <label for="personas-visita">Número de personas:</label>
          <input type="number" id="personas-visita" name="personas" min="1" max="50" value="1" required>
        </fieldset>

        <div class="fila-botones">
          <button type="reset" class="btn btn-secundario">Limpiar</button>
          <button type="submit" class="btn btn-primario">Generar folio</button>
        </div>

        <div id="resultado-folio" class="caja-folio" style="display: none; margin-top: 1.5rem;">
          <p class="folio-titulo">Folio generado: <span id="codigo-folio"></span></p>
          <p id="detalle-folio" class="folio-detalle"></p>
          <div class="fila-botones" style="margin-top: 1rem;">
            <a href="index.html" class="btn btn-secundario">Ir al inicio</a>
          </div>
        </div>
      </form>
    </div>
  </main>

  <footer class="pie">
    <div class="contenedor">
      <p>2026 Museo Vórtice. Proyecto académico de Programación Web I.</p>
    </div>
  </footer>

  <script>
    const formAgenda = document.getElementById("form-agenda");

    formAgenda.addEventListener("submit", function (evento) {
      evento.preventDefault();

      const nombre = document.getElementById("nombre-visita").value.trim();
      const fecha = document.getElementById("fecha-visita").value;
      const entrada = document.getElementById("entrada-visita").value;
      const personas = document.getElementById("personas-visita").value;

      const folio = "VRT-" + Math.floor(1000 + Math.random() * 9000);
      const detalle = `${nombre} | ${fecha} | ${entrada} | ${personas} persona(s)`;

      document.getElementById("codigo-folio").textContent = folio;
      document.getElementById("detalle-folio").textContent = detalle;
      document.getElementById("resultado-folio").style.display = "block";
    });
  </script>
</body>
</html>
